bind 0.0.0.0
protected-mode no
port 6379
dir /data

# RDB snapshots 
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100

maxmemory 256mb
maxmemory-policy volatile-lru

min-replicas-to-write 1
min-replicas-max-lag 10


replica-announce-ip redis-master
replica-announce-port 6379
